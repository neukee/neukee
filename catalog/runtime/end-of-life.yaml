# Source: Node.js Releases, nodejs.org (fetched 2026-11-25); end dates from the Node.js release
# schedule, https://github.com/nodejs/Release/blob/main/schedule.json.
# "Production applications should only use Active LTS or Maintenance LTS releases."
id: runtime/end-of-life
title: Declared Node.js version is past end-of-life
applies:
  tool: node
severity: warning
detector: runtime/sources
message: >-
  This Node.js major has passed its end-of-life date and no longer gets fixes, including security
  fixes, from the Node.js project. Production applications should only use Active LTS or
  Maintenance LTS releases.
fix: Move this declaration to an Active LTS or Maintenance LTS release.
sourceUrl: https://nodejs.org/en/about/previous-releases
fixtures:
  positive: fixtures/rules/runtime-end-of-life/positive
  negative: fixtures/rules/runtime-end-of-life/negative
