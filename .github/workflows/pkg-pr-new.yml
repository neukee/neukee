name: preview

# Continuous preview packages (ADR-019). Every pull request from this repository and
# every push to main publishes installable builds of @neukee/core, @neukee/scanner and
# @neukee/cli to pkg.pr.new. Nothing is published to npm. The pkg.pr.new GitHub App posts
# the pull request comment, so this workflow needs no write token.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: publish previews
    # Pull requests from forks are skipped: their preview would be someone else's code,
    # installable under the neukee/neukee name.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs, as in ci.yml; Dependabot proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # --pnpm packs with pnpm so workspace:* dependencies resolve to the preview builds.
      # --compact falls back to full URLs until the packages exist on npm (v0.1.0).
      # --bin shows a run command for the CLI instead of an install command.
      # --no-template skips the StackBlitz project, which a CLI doesn't need.
      - name: Publish previews to pkg.pr.new
        run: pnpm exec pkg-pr-new publish --pnpm --compact --bin=@neukee/cli --no-template --comment=update './packages/*'
